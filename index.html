<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home of Premier League | Sports Hub Official</title>
    <!-- Favicon -->
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3jvhee0-_V6RWnWEIbtMRcAcorU9PqoRSI3vhTi0ugis7VSsUj9i3xaA&s=10" type="image/x-icon">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Video.js CSS & JS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        :root {
            --bg-dark: #07040d;
            --card-bg: rgba(18, 10, 30, 0.75);
            --pl-green: #00ff85;
            --pl-cyan: #00f2fe;
            --pl-purple: #38003c;
            --neon-pink: #e90052;
            --glass-border: rgba(0, 255, 133, 0.25);
            --text-main: #ffffff;
            --text-sub: #a39bb8;
            --font-tech: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 0, 60, 0.6) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.25) 0%, transparent 45%),
                linear-gradient(to bottom, rgba(7, 4, 13, 0.95), rgba(7, 4, 13, 0.98));
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Cyber Grid Background Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 36px 36px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 133, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 133, 0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0512;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--pl-purple);
            border: 1px solid var(--pl-green);
            border-radius: 4px;
        }

        /* Header Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(12, 5, 22, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 30px rgba(0, 255, 133, 0.15);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-bezel {
            background: #ffffff;
            padding: 6px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 133, 0.4);
            border: 2px solid var(--pl-green);
        }

        .logo-bezel img {
            height: 38px;
            width: auto;
            display: block;
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-family: var(--font-tech);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #ffffff, var(--pl-green), var(--pl-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .brand-sub {
            font-family: var(--font-sub);
            font-size: 0.82rem;
            color: var(--pl-cyan);
            font-weight: 600;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-badge {
            background: rgba(233, 0, 82, 0.15);
            border: 1px solid var(--neon-pink);
            color: #fff;
            padding: 8px 18px;
            border-radius: 30px;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 15px rgba(233, 0, 82, 0.4);
            animation: pulse-glow 2s infinite alternate;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--neon-pink);
            animation: blink 1s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(233, 0, 82, 0.3); }
            100% { box-shadow: 0 0 22px rgba(233, 0, 82, 0.8); }
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 24px auto;
            padding: 0 20px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* Player Styling */
        .player-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 255, 133, 0.1);
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .player-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--pl-green), var(--pl-cyan), transparent);
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
        }

        /* Player Containers Visibility Switch */
        .player-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: none;
        }

        .player-element.active-player {
            display: block;
        }

        /* Video.js Custom Styling */
        .video-js .vjs-big-play-button {
            background-color: rgba(0, 255, 133, 0.85) !important;
            border: 2px solid var(--pl-green) !important;
            color: #000 !important;
            border-radius: 50% !important;
            width: 70px !important;
            height: 70px !important;
            line-height: 66px !important;
            margin-top: -35px !important;
            margin-left: -35px !important;
            box-shadow: 0 0 25px rgba(0, 255, 133, 0.6);
        }

        .video-js .vjs-play-progress {
            background-color: var(--pl-green);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 8px 4px 8px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .player-info h3 {
            font-family: var(--font-tech);
            font-size: 1.15rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.5px;
        }

        .player-info h3 i {
            color: var(--pl-green);
            filter: drop-shadow(0 0 8px var(--pl-green));
        }

        .badge-ultra {
            font-family: var(--font-sub);
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid var(--pl-cyan);
            padding: 6px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        /* Categorized Channel Directory */
        .category-section {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 24px;
        }

        .category-header {
            font-family: var(--font-tech);
            font-size: 1.05rem;
            color: var(--pl-green);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
        }

        .category-header i {
            color: var(--pl-cyan);
            filter: drop-shadow(0 0 5px var(--pl-cyan));
        }

        .channel-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .channel-btn .btn-label {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-btn i {
            font-size: 0.9rem;
            color: var(--pl-green);
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .channel-btn:hover {
            background: rgba(0, 255, 133, 0.1);
            border-color: var(--pl-green);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 255, 133, 0.25);
        }

        .channel-btn.active {
            background: linear-gradient(135deg, var(--pl-green), #00c868);
            color: var(--pl-purple);
            font-weight: 700;
            border-color: var(--pl-green);
            box-shadow: 0 0 22px rgba(0, 255, 133, 0.6);
            transform: scale(1.01);
        }

        .channel-btn.active i {
            color: var(--pl-purple) !important;
        }

        .channel-btn .status-tag {
            font-family: var(--font-sub);
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .channel-btn.active .status-tag {
            background: rgba(56, 0, 60, 0.2);
            color: var(--pl-purple);
            font-weight: 700;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            color: var(--text-sub);
            background: rgba(6, 3, 12, 0.9);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-family: var(--font-sub);
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        footer strong {
            color: var(--pl-green);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
            }

            .brand h1 {
                font-size: 1rem;
            }

            .brand-sub {
                font-size: 0.7rem;
            }

            .live-badge {
                padding: 6px 12px;
                font-size: 0.68rem;
            }

            .container {
                padding: 0 12px;
                margin: 16px auto;
            }

            .category-section {
                padding: 18px;
            }

            .channel-buttons-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="logo-bezel">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Premier_League_Logo.svg/1280px-Premier_League_Logo.svg.png" alt="Premier League Logo">
            </div>
            <div class="brand-titles">
                <h1>Home of Premier League</h1>
                <span class="brand-sub"><i class="fa-solid fa-circle-check"></i> Sports Hub Official (Football Media Center)</span>
            </div>
        </div>
        <div class="live-badge">
            <div class="pulse-dot"></div>
            LIVE BROADCAST
        </div>
    </header>

    <div class="container">
        
        <!-- Hybrid Player Wrapper -->
        <div class="player-wrapper">
            <div class="player-container">
                <!-- 1. Video.js Player Element -->
                <div id="vjs-player-box" class="player-element active-player">
                    <video id="vjs-player" class="video-js vjs-big-play-centered vjs-fluid w-full h-full" controls preload="auto" crossorigin="anonymous">
                        <p class="vjs-no-js">
                            Sila aktifkan JavaScript untuk menonton siaran ini.
                        </p>
                    </video>
                </div>

                <!-- 2. Iframe Player Element -->
                <iframe id="embed-player" 
                        class="player-element"
                        src="about:blank" 
                        allow="autoplay; encrypted-media; picture-in-picture; fullscreen" 
                        allowfullscreen>
                </iframe>
            </div>
            <div class="player-info">
                <h3 id="current-channel-title"><i class="fa-solid fa-tv"></i> beIN Sports 1</h3>
                <div class="badge-ultra">
                    <i class="fa-solid fa-wifi" style="color: var(--pl-green);"></i> <span id="player-type-label">Video.js Player</span>
                </div>
            </div>
        </div>

<!-- Category 1: beIN Sports Arabia (Video.js Player) -->
<div class="category-section">
    <div class="category-header">
        <i class="fa-solid fa-globe"></i> Category 1: beIN Sports Arabia
    </div>
    <div class="channel-buttons-grid">
        <button class="channel-btn active" onclick="playChannel('beIN Sports 1', 'https://cp11.adabmedia.com/hls2/bein1.m3u8', 'videojs', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>beIN Sports 1</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
        <button class="channel-btn" onclick="playChannel('beIN Sports 2', 'https://cp11.adabmedia.com/hls2/bein2.m3u8', 'videojs', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>beIN Sports 2</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
        <button class="channel-btn" onclick="playChannel('beIN Sports 3', 'https://cp11.adabmedia.com/hls2/bein3.m3u8', 'videojs', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>beIN Sports 3</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
    </div>
</div>

<!-- Category 2: Star Sports -->
<div class="category-section">
    <div class="category-header">
        <i class="fa-solid fa-star"></i> Category 2: Star Sports
    </div>
    <div class="channel-buttons-grid">
        <button class="channel-btn" onclick="playChannel('Star Sports Select 1 HD', 'https://sbsw.b-cdn.net/StarSportsHD1/720p1m/video.m3u8', 'iframe', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>Star Sports Select 1 HD</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
        <button class="channel-btn" onclick="playChannel('Star Sports Select 2 HD', 'https://sbsw.b-cdn.net/StarSportsHD2/720p1m/video.m3u8', 'iframe', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>Star Sports Select 2 HD</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
        <button class="channel-btn" onclick="playChannel('Star Sports Select 1 FHD', 'https://footfytv.pro/proxy/direct?url=http://livetv.akr4m.com:8080/bdtv/restrem/40.m3u8', 'videojs', this)">
            <div class="btn-label">
                <i class="fa-solid fa-play"></i>
                <span>Star Sports Select 1 FHD</span>
            </div>
            <span class="status-tag">LIVE</span>
        </button>
    </div>
</div>

    </div>

    <footer>
        <div>&copy; 2026 <strong>Sports Hub Official (Football Media Center)</strong>. All rights reserved.</div>
        <div style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.4);">POWERED BY HYBRID VIDEO.JS & ICANPLAY EMBED FRAMEWORK</div>
    </footer>

    <script>
        let vjsPlayer = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Inisialisasi Video.js Player
            vjsPlayer = videojs('vjs-player', {
                autoplay: true,
                controls: true,
                responsive: true,
                fluid: true,
                liveui: true,
                html5: {
                    vhs: { overrideNative: true },
                    nativeAudioTracks: false,
                    nativeVideoTracks: false
                }
            });

            // Set Mula-mula Main Saluran beIN Sports 1 menggunakan Video.js
            playChannel('beIN Sports 1', 'https://cp11.adabmedia.com/hls2/bein1.m3u8', 'videojs', document.querySelector('.channel-btn.active'));
        });

        function playChannel(channelTitle, m3u8Url, playerType, element) {
            // Kemas kini Tajuk Saluran
            document.getElementById('current-channel-title').innerHTML = '<i class="fa-solid fa-tv"></i> ' + channelTitle;

            const vjsBox = document.getElementById('vjs-player-box');
            const iframePlayer = document.getElementById('embed-player');
            const playerLabel = document.getElementById('player-type-label');

            if (playerType === 'videojs') {
                // Tunjuk Video.js, Sembunyikan Iframe
                iframePlayer.classList.remove('active-player');
                iframePlayer.src = 'about:blank'; // Hentikan Iframe jika ada

                vjsBox.classList.add('active-player');
                playerLabel.textContent = 'Video.js Player';

                // Mainkan menerusi Video.js
                if (vjsPlayer) {
                    vjsPlayer.pause();
                    vjsPlayer.src({
                        src: m3u8Url,
                        type: 'application/x-mpegURL'
                    });
                    vjsPlayer.load();
                    vjsPlayer.play().catch(function(err) {
                        console.log("Autoplay ditahan pengguna:", err);
                    });
                }
            } else if (playerType === 'iframe') {
                // Tunjuk Iframe, Sembunyikan & Paus Video.js
                if (vjsPlayer) {
                    vjsPlayer.pause();
                }

                vjsBox.classList.remove('active-player');
                iframePlayer.classList.add('active-player');
                playerLabel.textContent = 'Iframe Player';

                // Tukar sumber Iframe secara lancar
                iframePlayer.src = 'https://player.icanplay.my.id/?url=' + encodeURIComponent(m3u8Url);
            }

            // Kemas kini status butang aktif
            var buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }

            // Scroll ke pemain pada skrin telefon
            if (window.innerWidth <= 768) {
                document.querySelector('.player-wrapper').scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
