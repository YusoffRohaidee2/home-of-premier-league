<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home of Premier League | Sports Hub Official</title>
    <!-- Favicon -->
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT3jvhee0-_V6RWnWEIbtMRcAcorU9PqoRSI3vhTi0ugis7VSsUj9i3xaA&s=10" type="image/x-icon">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Video.js CSS & JS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        :root {
            --bg-dark: #030008;
            --card-bg: rgba(12, 6, 24, 0.85);
            --neon-green: #00ffcc;
            --neon-blue: #0088ff;
            --neon-pink: #ff0055;
            --neon-purple: #9d00ff;
            --glass-border: rgba(0, 255, 204, 0.3);
            --text-main: #ffffff;
            --text-sub: #b0a6d4;
            --font-tech: 'Orbitron', sans-serif;
            --font-sub: 'Rajdhani', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(157, 0, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(0, 136, 255, 0.2) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(0, 255, 204, 0.08) 0%, transparent 70%),
                linear-gradient(to bottom, #030008, #070212);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Futuristic Cyber Grid Background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: 0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #05020c;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-purple);
            border: 1px solid var(--neon-green);
            border-radius: 3px;
        }

        /* Header HUD Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 2, 12, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0, 255, 204, 0.15);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-bezel {
            background: #0c0618;
            padding: 8px 16px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3), inset 0 0 10px rgba(0, 255, 204, 0.2);
            border: 1px solid var(--neon-green);
        }

        .logo-bezel img {
            height: 34px;
            width: auto;
            display: block;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.6));
        }

        .brand-titles {
            display: flex;
            flex-direction: column;
        }

        .brand h1 {
            font-family: var(--font-tech);
            font-size: 1.3rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #ffffff, var(--neon-green), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0,255,204,0.4);
        }

        .brand-sub {
            font-family: var(--font-sub);
            font-size: 0.85rem;
            color: var(--neon-blue);
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-badge {
            background: rgba(255, 0, 85, 0.15);
            border: 1px solid var(--neon-pink);
            color: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: var(--font-tech);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
            animation: pulse-glow 2s infinite alternate;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--neon-pink);
            animation: blink 1s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(255, 0, 85, 0.4); }
            100% { box-shadow: 0 0 25px rgba(255, 0, 85, 0.9); }
        }

        @keyframes blink {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .container {
            max-width: 1300px;
            width: 100%;
            margin: 28px auto;
            padding: 0 20px;
            flex: 1;
            position: relative;
            z-index: 1;
        }

        /* Holographic Player Wrapper */
        .player-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 18px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 255, 204, 0.15);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
        }

        .player-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-green), var(--neon-blue), var(--neon-purple), transparent);
        }

        .player-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.9);
        }

        .player-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100% !important;
            height: 100% !important;
            border: none;
            display: none;
        }

        .player-element.active-player {
            display: block;
        }

        /* Video.js Cyber Styling */
        .video-js .vjs-big-play-button {
            background-color: rgba(0, 255, 204, 0.85) !important;
            border: 2px solid var(--neon-green) !important;
            color: #030008 !important;
            border-radius: 50% !important;
            width: 75px !important;
            height: 75px !important;
            line-height: 71px !important;
            margin-top: -37.5px !important;
            margin-left: -37.5px !important;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.8);
            transition: all 0.3s ease;
        }

        .video-js .vjs-big-play-button:hover {
            transform: scale(1.1);
            background-color: var(--neon-green) !important;
        }

        .video-js .vjs-play-progress {
            background-color: var(--neon-green);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 10px 6px 10px;
            flex-wrap: wrap;
            gap: 14px;
        }

        .player-info h3 {
            font-family: var(--font-tech);
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
        }

        .player-info h3 i {
            color: var(--neon-green);
            filter: drop-shadow(0 0 10px var(--neon-green));
        }

        .badge-ultra {
            font-family: var(--font-sub);
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            background: rgba(0, 136, 255, 0.15);
            border: 1px solid var(--neon-blue);
            padding: 6px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.3);
        }

        /* Category & Channel Grid */
        .category-section {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 26px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
        }

        .category-header {
            font-family: var(--font-tech);
            font-size: 1.1rem;
            color: var(--neon-green);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid rgba(0, 255, 204, 0.15);
            padding-bottom: 14px;
            text-shadow: 0 0 10px rgba(0,255,204,0.4);
        }

        .category-header i {
            color: var(--neon-blue);
            filter: drop-shadow(0 0 8px var(--neon-blue));
        }

        .channel-buttons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 16px;
        }

        .channel-btn {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            border: 1px solid rgba(0, 255, 204, 0.15);
            padding: 16px 18px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--font-body);
            font-size: 0.95rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .channel-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 204, 0.1), transparent);
            transition: 0.5s;
        }

        .channel-btn:hover::before {
            left: 100%;
        }

        .channel-btn .btn-label {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .channel-btn i {
            font-size: 0.95rem;
            color: var(--neon-green);
            transition: transform 0.3s ease;
            flex-shrink: 0;
            filter: drop-shadow(0 0 5px var(--neon-green));
        }

        .channel-btn:hover {
            background: rgba(0, 255, 204, 0.08);
            border-color: var(--neon-green);
            color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.3);
        }

        .channel-btn.active {
            background: linear-gradient(135deg, var(--neon-green), #00b386);
            color: #030008;
            font-weight: 800;
            border-color: var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.7);
            transform: scale(1.02);
        }

        .channel-btn.active i {
            color: #030008 !important;
            filter: none;
        }

        .channel-btn .status-tag {
            font-family: var(--font-sub);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(0,0,0,0.4);
            letter-spacing: 0.8px;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .channel-btn.active .status-tag {
            background: rgba(3, 0, 8, 0.25);
            color: #030008;
            border-color: rgba(3, 0, 8, 0.3);
            font-weight: 800;
        }

        footer {
            margin-top: 50px;
            text-align: center;
            padding: 28px;
            font-size: 0.85rem;
            color: var(--text-sub);
            background: rgba(3, 0, 8, 0.95);
            border-top: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: var(--font-sub);
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        footer strong {
            color: var(--neon-green);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,255,204,0.4);
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 18px;
            }
            .brand h1 {
                font-size: 1.05rem;
            }
            .brand-sub {
                font-size: 0.72rem;
            }
            .live-badge {
                padding: 6px 12px;
                font-size: 0.68rem;
            }
            .container {
                padding: 0 12px;
                margin: 16px auto;
            }
            .category-section {
                padding: 18px;
            }
            .channel-buttons-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="player-wrapper">

                    <div class="btn-label">

                <!-- 5. DAZN 2 Portugal (Video.js) -->

    <footer>
        <div>&copy; 2026 <strong>Sports Hub Official (Football Media Center)</strong>. All rights reserved.</div>
        <div style="font-size: 0.75rem; color: rgba(255, 255, 255, 0.4);">POWERED BY HOLOGRAPHIC HYBRID VIDEO.JS & ICANPLAY EMBED FRAMEWORK</div>
    </footer>

    <script>
        let vjsPlayer = null;

        document.addEventListener('DOMContentLoaded', function() {
            // Inisialisasi Video.js Player
            vjsPlayer = videojs('vjs-player', {
                autoplay: true,
                controls: true,
                responsive: true,
                fluid: true,
                liveui: true,
                html5: {
                    vhs: { overrideNative: true },
                    nativeAudioTracks: false,
                    nativeVideoTracks: false
                }
            });

            // Set Mula-mula Main Saluran Star Sports Select 1 menggunakan Iframe
            playChannel('Star Sports Select 1', 'https://sbsw.b-cdn.net/StarSportsHD1/720p1m/video.m3u8', 'iframe', document.querySelector('.channel-btn.active'));
        });

        function playChannel(channelTitle, m3u8Url, playerType, element) {
            // Kemas kini Tajuk Saluran
            document.getElementById('current-channel-title').innerHTML = '<i class="fa-solid fa-satellite-dish"></i> ' + channelTitle;

            const vjsBox = document.getElementById('vjs-player-box');
            const iframePlayer = document.getElementById('embed-player');
            const playerLabel = document.getElementById('player-type-label');

            if (playerType === 'videojs') {
                // Tunjuk Video.js, Sembunyikan Iframe
                iframePlayer.classList.remove('active-player');
                iframePlayer.src = 'about:blank'; // Hentikan Iframe

                vjsBox.classList.add('active-player');
                playerLabel.textContent = 'Video.js Player';

                // Mainkan menerusi Video.js
                if (vjsPlayer) {
                    vjsPlayer.pause();
                    vjsPlayer.src({
                        src: m3u8Url,
                        type: 'application/x-mpegURL'
                    });
                    vjsPlayer.load();
                    vjsPlayer.play().catch(function(err) {
                        console.log("Autoplay ditahan pengguna:", err);
                    });
                }
            } else if (playerType === 'iframe') {
                // Tunjuk Iframe, Sembunyikan & Paus Video.js
                if (vjsPlayer) {
                    vjsPlayer.pause();
                }

                vjsBox.classList.remove('active-player');
                iframePlayer.classList.add('active-player');
                playerLabel.textContent = 'Iframe Player';

                // Tukar sumber Iframe secara lancar
                iframePlayer.src = 'https://player.icanplay.my.id/?url=' + encodeURIComponent(m3u8Url);
            }

            // Kemas kini status butang aktif
            var buttons = document.querySelectorAll('.channel-btn');
            buttons.forEach(function(btn) {
                btn.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }

            // Scroll ke pemain pada skrin telefon
            if (window.innerWidth <= 768) {
                document.querySelector('.player-wrapper').scrollIntoView({ behavior: 'smooth' });
            }
        }
    </script>
</body>
</html>
